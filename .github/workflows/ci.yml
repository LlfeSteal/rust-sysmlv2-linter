name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On annule les runs obsolètes d'une PR, jamais ceux de `main`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  generated:
    name: fichiers générés à jour
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # `src/spec.rs` et `src/stdlib.rs` sont dérivés des index vendus dans
      # `spec/`. On vérifie la régénération, pas le réseau : `--fetch` (qui
      # interroge l'OMG et GitHub) reste manuel.
      - run: python3 tools/gen-spec-table.py --check
      - run: python3 tools/gen-stdlib.py --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    name: MSRV 1.65
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.65.0 --profile minimal --no-self-update
      # `check` et non `test` : on veut seulement prouver que la MSRV déclarée
      # dans Cargo.toml compile. `--all-targets` couvre aussi tests/cli.rs.
      - run: cargo +1.65.0 check --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Le contrat de CLAUDE.md : le build doit être sans avertissement.
      - run: cargo build --all-targets --locked
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --locked --all-targets
