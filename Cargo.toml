[package]
name = "sysml-check"
version = "1.0.0"
edition = "2021"
rust-version = "1.65"
description = "Parseur et vérificateur de la notation textuelle SysML v2 (KerML). Zéro dépendance."
license = "GPL-3.0-only"
repository = "https://github.com/LlfeSteal/rust-sysmlv2-linter"
readme = "README.md"
keywords = ["sysml", "kerml", "linter", "mbse", "parser"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sysml-check"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
